# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "qso-graph-dxcluster-cli"
description = "Receive DX spots and replay recorded cluster sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ham-radio", "dx-cluster", "rbn", "terminal", "protocol"]
categories = ["network-programming", "command-line-utilities"]
# Conformance vectors and integration tests stay in the repository.
include = ["src/**/*.rs", "README.md", "LICENSE", "NOTICE.md"]
[[bin]]
name = "qg-dxc"
path = "src/main.rs"
[dependencies]
qso-graph-dxcluster = { path = "../qso-graph-dxcluster", version = "=0.6.0" }
qso-graph-spaceweather = { path = "../qso-graph-spaceweather", version = "=0.6.0" }
serde_json = "=1.0.145"
# Already in the graph through serde_json; used without derive to refuse duplicate JSON members.
serde_core = { version = "=1.0.229", default-features = false, features = ["std"] }
ctrlc = "=3.5.1"
getrandom = "=0.4.3"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
# QGDXC-TUI-0115 (D4): pin the HTTPS client and its AWS-LC provider here.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
aws-lc-rs = { version = "=1.18.1", default-features = false }
aws-lc-sys = { version = "=0.45.0", default-features = false }
[lints]
workspace = true
