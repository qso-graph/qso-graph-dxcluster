# SPDX-License-Identifier: GPL-3.0-or-later
name: CI
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ci-all-green (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # cog check reads the commits since the latest release tag.
          fetch-depth: 0
      - name: Pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Pinned verification tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked --quiet
          cargo install cargo-vet --version 0.10.3 --locked --quiet
          cargo install cargo-audit --version 0.22.2 --locked --quiet
      - name: Pinned Linux fuzz tools
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly-2026-10-30 --profile minimal --component rustfmt --component clippy
          cargo install cargo-fuzz --version 0.13.2 --locked --quiet
      - name: Pinned Linux cocogitto
        if: runner.os == 'Linux'
        env:
          COG_SHA256: e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/cog.tar.gz" \
            https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz
          echo "$COG_SHA256  $RUNNER_TEMP/cog.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cog"
          tar -xzf "$RUNNER_TEMP/cog.tar.gz" -C "$RUNNER_TEMP/cog" --strip-components=1
          echo "$RUNNER_TEMP/cog" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Verify
        run: cargo xtask verify
      - name: Retain verification logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: target/verify/
          if-no-files-found: ignore

  # Exercise unsigned assembly on all release platforms before merging.
  binaries:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/binaries.yml
    with:
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      sign: false

  ci-all-green:
    name: ci-all-green
    needs: [verify, binaries]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a job did not pass: $result"; exit 1; }
          done
